name: Deploy pull request preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    # GitHub does not expose repository secrets to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build root-hosted preview
        run: npm run build:preview
      - name: Deploy isolated Cloudflare Pages preview
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=iosif-math-teacher-preview --branch=${{ github.head_ref || github.ref_name }}
      - name: Publish preview link on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- iosif-dashboard-preview -->'
            const body = `${marker}\n## Dashboard preview\n\n✅ ${process.env.PREVIEW_URL}\n\nThis deployment contains the current pull request revision and does not replace production GitHub Pages.`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
